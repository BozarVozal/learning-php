; Только для продакшена: посетитель не должен видеть текст ошибок
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On

; Кэш скомпилированного байт-кода — главный ускоритель PHP
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Код в образе неизменяем, проверять файлы на изменения незачем
opcache.validate_timestamps = 0
