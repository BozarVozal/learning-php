server {
    # Порт внутри контейнера nginx
    listen 80;
    server_name localhost;

    # Корень сайта: наружу открыта только папка public
    root /var/www/html/public;
    index index.php index.html;

    # Обычные запросы: ищем файл, иначе отдаём в index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Всё, что заканчивается на .php, уходит в PHP-FPM
    location ~ \.php$ {
        # "php" — имя контейнера, 9000 — порт FastCGI
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # Путь к файлу, каким его увидит контейнер PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
