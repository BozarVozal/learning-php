services:

  # Веб-сервер: принимает запросы из браузера
  web:
    image: nginx:alpine
    ports:
      # 8081, а не 8080: 8080 занят проектом learning-docker
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # Интерпретатор PHP: свой образ с pdo_pgsql и Composer
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Подсказка PhpStorm, к какому серверу относится сессия отладки
      PHP_IDE_CONFIG: serverName=learning-php
    depends_on:
      db:
        condition: service_healthy

  # База данных
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # В PostgreSQL 18+ том вешается сюда, а не на /data
      - pgdata:/var/lib/postgresql
    ports:
      # Снаружи 5433: порт 5432 занят базой проекта learning-docker
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

# Именованный том: здесь PostgreSQL хранит данные
volumes:
  pgdata:
